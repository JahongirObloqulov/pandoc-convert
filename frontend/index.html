<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandoc Konverteri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen" style="font-family: 'Montserrat', sans-serif;">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-200">

    <h2 class="text-3xl font-extrabold mb-6 text-center text-slate-800 tracking-tight">
        Pandoc <span class="text-blue-600">Konverteri</span>
    </h2>

    <div class="mb-5">
        <label class="block text-slate-700 text-sm font-semibold mb-2">Asl fayl:</label>
        <div class="flex gap-2">
            <input type="text" id="inputPath" readonly
                   class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 cursor-not-allowed"
                   placeholder="Faylni tanlang...">
            <button onclick="selectInput()"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition-colors focus:ring-4 focus:ring-blue-300 shadow-sm">
                Tanlash
            </button>
        </div>
    </div>

    <div class="mb-5">
        <label class="block text-slate-700 text-sm font-semibold mb-2">Qaysi formatga o'giramiz?</label>
        <select id="formatSelect"
                class="bg-white border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 shadow-sm font-medium cursor-pointer">
            <option value=".docx">Microsoft Word (.docx)</option>
            <option value=".pdf">PDF hujjat (.pdf)</option>
            <option value=".epub">EPUB Elektron kitob (.epub)</option>
            <option value=".tex">LaTeX hujjat (.tex)</option>
            <option value=".html">HTML veb-sahifa (.html)</option>
            <option value=".md">Markdown (.md)</option>
            <option value=".txt">Oddiy matn (.txt)</option>
        </select>
    </div>

    <div class="mb-6">
        <label class="block text-slate-700 text-sm font-semibold mb-2">Natijani saqlash joyi:</label>
        <div class="flex gap-2">
            <input type="text" id="outputPath" readonly
                   class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 cursor-not-allowed"
                   placeholder="Saqlash joyi...">
            <button onclick="selectOutput()"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition-colors focus:ring-4 focus:ring-blue-300 shadow-sm">
                Saqlash
            </button>
        </div>
    </div>

    <div id="messageBox" class="mb-5 text-sm font-semibold text-center hidden p-3 rounded-lg transition-all"></div>

    <button onclick="convert()"
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-lg rounded-xl px-5 py-3.5 transition-all shadow-md hover:shadow-lg focus:ring-4 focus:ring-emerald-300">
        Konvertatsiya qilish
    </button>
</div>

<script src="/wailsjs/go/main/App.js"></script>
<script>
    async function selectInput() {
        // GO'dan SelectInputFile ni chaqirish
        let path = await window.go.main.App.SelectInputFile();
        if (path) {
            document.getElementById('inputPath').value = path;
            document.getElementById('outputPath').value = '';
        }
    }

    async function selectOutput() {
        let selectedFormat = document.getElementById('formatSelect').value;
        // GO'dan SelectOutputFile ni chaqirish
        let path = await window.go.main.App.SelectOutputFile(selectedFormat);
        if (path) document.getElementById('outputPath').value = path;
    }

    async function convert() {
        let input = document.getElementById('inputPath').value;
        let output = document.getElementById('outputPath').value;
        let msgBox = document.getElementById('messageBox');

        if (!input || !output) {
            msgBox.innerText = "⚠️ Iltimos, avval fayllarni tanlang!";
            msgBox.className = "mb-5 text-sm font-semibold text-center block p-3 rounded-lg bg-red-100 text-red-700";
            return;
        }

        msgBox.innerText = "⏳ Kutib turing, konvertatsiya qilinmoqda...";
        msgBox.className = "mb-5 text-sm font-semibold text-center block p-3 rounded-lg bg-blue-100 text-blue-700";

        // GO'dan ConvertFile ni chaqirish
        let result = await window.go.main.App.ConvertFile(input, output);

        if (result === "success") {
            msgBox.innerText = "✅ Muvaffaqiyatli o'girildi va saqlandi!";
            msgBox.className = "mb-5 text-sm font-semibold text-center block p-3 rounded-lg bg-emerald-100 text-emerald-800";
        } else {
            msgBox.innerText = "❌ Xatolik: " + result;
            msgBox.className = "mb-5 text-sm font-semibold text-center block p-3 rounded-lg bg-red-100 text-red-700";
        }
    }
</script>
</body>
</html>
