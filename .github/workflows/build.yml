name: Build Cross-Platform Offline Desktop App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: pandoc-pro-windows.exe
          - platform: macos
            os: macos-latest
            artifact: pandoc-pro-mac.zip
          - platform: linux
            os: ubuntu-latest
            artifact: pandoc-pro-linux.tar.gz

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      # go.mod dagi versiya bilan bir xil bo'lishi kerak
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Application (Windows)
        if: matrix.platform == 'windows'
        run: wails build -nopackage

      # Universal binary: Apple Silicon (M1-M4) va Intel Mac'larda ishlaydi
      - name: Build Application (macOS)
        if: matrix.platform == 'macos'
        run: wails build -platform darwin/universal

      - name: Build Application (Linux)
        if: matrix.platform == 'linux'
        run: wails build -tags webkit2_41

      # Windows uchun Pandoc'ni yuklab olish va NSIS installerini yig'ish
      - name: Bundle Pandoc for Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          curl.exe -L -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-windows-x86_64.zip"
          Expand-Archive -Path pandoc.zip -DestinationPath pandoc-extracted
          Get-ChildItem -Path "pandoc-extracted" -Filter "pandoc.exe" -Recurse | Copy-Item -Destination "build\bin\"
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      # macOS uchun arm64 va x86_64 Pandoc'ni yuklab olib, bitta universal faylga birlashtirish (lipo)
      - name: Bundle Pandoc for macOS
        if: matrix.platform == 'macos'
        run: |
          curl -fL -o pandoc-arm64.zip "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-arm64-macOS.zip"
          curl -fL -o pandoc-x86_64.zip "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-x86_64-macOS.zip"
          unzip -q pandoc-arm64.zip -d pandoc-arm64
          unzip -q pandoc-x86_64.zip -d pandoc-x86_64
          ARM_BIN=$(find pandoc-arm64 -path '*/bin/pandoc' -type f | head -n 1)
          X86_BIN=$(find pandoc-x86_64 -path '*/bin/pandoc' -type f | head -n 1)
          lipo -create -output build/bin/pandoc-app.app/Contents/MacOS/pandoc "$ARM_BIN" "$X86_BIN"
          chmod +x build/bin/pandoc-app.app/Contents/MacOS/pandoc
          lipo -info build/bin/pandoc-app.app/Contents/MacOS/pandoc
          cd build/bin
          zip -r ../../pandoc-pro-mac.zip pandoc-app.app

      # Linux uchun Pandoc'ni yuklab olish va zip/tar.gz qilish
      - name: Bundle Pandoc for Linux
        if: matrix.platform == 'linux'
        run: |
          curl -L -o pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz"
          tar -xzf pandoc.tar.gz
          find pandoc-3.9 -name pandoc -type f -exec cp {} build/bin/ \;
          cd build/bin
          tar -czf ../../pandoc-pro-linux.tar.gz pandoc-app pandoc

      # Tayyor o'rnatuvchi fayllarni yuklash (GitHub Artifacts)
      - name: Upload Windows Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: pandoc-pro-windows-installer
          path: build/bin/pandoc-pro-installer.exe

      - name: Upload macOS Artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: pandoc-pro-mac-app
          path: pandoc-pro-mac.zip

      - name: Upload Linux Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: pandoc-pro-linux-bundle
          path: pandoc-pro-linux.tar.gz
