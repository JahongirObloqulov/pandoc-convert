name: Build Cross-Platform Offline Desktop App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: pandoc-pro-windows.exe
          - platform: macos
            os: macos-latest
            artifact: pandoc-pro-mac.zip
          - platform: linux
            os: ubuntu-latest
            artifact: pandoc-pro-linux.tar.gz

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: |
          # Go bin papkasi PATH yo'liga qo'shilgan, shuning uchun wails deb ishlatish mumkin
          wails build

      # Windows uchun Pandoc'ni yuklab olish va NSIS installerini yig'ish
      - name: Bundle Pandoc for Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-windows-x86_64.zip"
          Expand-Archive -Path pandoc.zip -DestinationPath pandoc-extracted
          Get-ChildItem -Path "pandoc-extracted" -Filter "pandoc.exe" -Recurse | Copy-Item -Destination "build\bin\"
          makensis installer.nsi

      # macOS uchun Pandoc'ni yuklab olish va App bundle ichiga joylashtirib, zip qilish
      - name: Bundle Pandoc for macOS
        if: matrix.platform == 'macos'
        run: |
          curl -L -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-arm64-macOS.zip"
          unzip pandoc.zip -d pandoc-extracted
          find pandoc-extracted -name pandoc -type f -exec cp {} build/bin/pandoc-app.app/Contents/MacOS/ \;
          cd build/bin
          zip -r ../../pandoc-pro-mac.zip pandoc-app.app

      # Linux uchun Pandoc'ni yuklab olish va zip/tar.gz qilish
      - name: Bundle Pandoc for Linux
        if: matrix.platform == 'linux'
        run: |
          curl -L -o pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz"
          tar -xzf pandoc.tar.gz
          find pandoc-3.9 -name pandoc -type f -exec cp {} build/bin/ \;
          cd build/bin
          tar -czf ../../pandoc-pro-linux.tar.gz pandoc-app pandoc

      # Tayyor o'rnatuvchi fayllarni yuklash (GitHub Artifacts)
      - name: Upload Windows Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-pro-windows-installer
          path: build/bin/pandoc-pro-installer.exe

      - name: Upload macOS Artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-pro-mac-app
          path: pandoc-pro-mac.zip

      - name: Upload Linux Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pandoc-pro-linux-bundle
          path: pandoc-pro-linux.tar.gz
